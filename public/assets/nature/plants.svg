<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc"><title id="title">Porównanie wzrostu siewek</title><desc id="desc">Dwie takie same doniczki. Siewka A rośnie w świetle: zielone liście, wysokość 4 cm. Siewka B rośnie w ciemności: cienka łodyga i blade liście, wysokość 8 cm.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#22384b} .line{stroke:#274558;stroke-width:4;stroke-linecap:round;stroke-linejoin:round} .label{font-size:24px;font-weight:700;text-anchor:middle} .small{font-size:22px;text-anchor:middle} .badge{fill:#fff;stroke:#274558;stroke-width:3} .call{fill:none;stroke:#47677a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><rect width="600" height="400" rx="24" fill="#f7fafb"/>
<rect x="24" y="25" width="263" height="347" rx="20" fill="#eef6e8"/><rect x="313" y="25" width="263" height="347" rx="20" fill="#e6edf4"/>
<text x="155" y="64" class="label">A · światło</text><text x="445" y="64" class="label">B · ciemność</text>
